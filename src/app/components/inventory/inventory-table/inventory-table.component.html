<h2 style="text-align: center;">Product Details</h2>
<mat-dialog-content>
  <div class="data-container d-flex justify-content-between">
    <img [src]="data.image_url" alt="{{data.title}}" width="120">
    <div class="container">
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
            <td mat-cell *matCellDef="let row" style="border-right: .1px solid #d2d2d2;">{{ row.title }}</td>
          </ng-container>

          <!-- Stock Column -->
          <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
            <td mat-cell *matCellDef="let row"  style="border-right: .1px solid #d2d2d2;">
              @if (input) {
                <input type="number" [(ngModel)]="row.stock" />
              } @else {
                {{ row.stock }}
              }
            </td>
          </ng-container>

          <!-- Price Column -->
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
            <td mat-cell *matCellDef="let row" style="border-right: .1px solid #d2d2d2;">
              @if (input) {
                <input type="number" [(ngModel)]="row.price" />
              } @else {
                {{ row.price | number:'1.2-2' }}
              }
            </td>       
          </ng-container> 
          
          <!-- Edition Column -->
          <ng-container matColumnDef="edition">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Edition</th>
            <td mat-cell *matCellDef="let row">{{ row.edition }}</td>
          </ng-container>

          <!-- Render Header and Rows -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
        <mat-dialog-actions class="justify-content-center">
          <button mat-button (click)="close()">Close</button>
          @if (input) {
            <button mat-button (click)="save()">Save changes</button>
          }@else {
            <button mat-button cdkFocusInitial (click)="edit()">Edit</button>
          }
          
        </mat-dialog-actions>
      </div>
    </div>
  </div>
</mat-dialog-content>
