<div class="container">
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Harry Potter" #input>
  </mat-form-field>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
      
      @for (column of displayedColumns(); track $index) {
      <ng-container [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef> {{column}} </th>
        <td mat-cell *matCellDef="let element">
          @if (element[column]||element[column]==0||element[column]==="") {
            {{element[column]}}
          }@else {
            <button mat-raised-button 
            (click)="openDialog(element,'500ms', '500ms')"
            >Open</button>
          } </td>
      </ng-container>
      }
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr><!-- () porque es una signal -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
